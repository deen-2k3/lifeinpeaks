# Render Blueprint — https://render.com/docs/blueprint-spec
# New → Blueprint → pick this repo. Render creates the database and the web service,
# then asks for the values marked `sync: false`.

databases:
  - name: lifeinpeaks-db
    plan: free            # free Postgres expires after 30 days — upgrade to keep data
    region: singapore
    databaseName: lifeinpeaks
    user: lifeinpeaks

services:
  - type: web
    name: lifeinpeaks
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci && npx prisma migrate deploy && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: lifeinpeaks-db
          property: connectionString
      - key: AUTH_SECRET
        generateValue: true
      - key: NEXT_PUBLIC_SITE_URL
        sync: false        # e.g. https://lifeinpeaks.onrender.com (or your domain)
      - key: STORAGE_PROVIDER
        value: cloudinary
      - key: NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: CLOUDINARY_FOLDER
        value: lifeinpeaks
